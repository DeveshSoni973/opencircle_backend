[project]
name = "opencircle-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.141.1",
    "opencircle-module",
    "sqlmodel>=0.0.42",
]

[project.scripts]
dev = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
opencircle-module = { path = "../opencircle_module", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
